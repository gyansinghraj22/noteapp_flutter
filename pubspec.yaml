name: noteapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  get_it: ^9.2.0
  equatable: ^2.0.8
  bloc: ^9.2.0
  dio: ^5.9.0
  logger: ^2.6.2
  chucker_flutter: ^1.9.1
  dartz: ^0.10.1
  file_picker: ^10.3.8
  image_picker: ^1.2.1
  flutter_bloc: ^9.1.1
  iconoir_flutter: ^7.11.0
  google_sign_in: ^7.2.0
  jp_prefecture: ^2.0.0
  flutter_facebook_auth: ^7.1.5
  device_preview: ^1.2.0
  url_launcher: ^6.3.2
  pinput: ^6.0.1
  flutter_native_splash: ^2.4.4
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  stomp_dart_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/l10n/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Light.otf
          weight: 300
        - asset: assets/fonts/Satoshi-Regular.otf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.otf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.otf
          weight: 900
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf
          weight: 400
        - asset: assets/fonts/Baloo2-Medium.ttf
          weight: 500
        - asset: assets/fonts/Baloo2-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Baloo2-Bold.ttf
          weight: 700
        - asset: assets/fonts/Baloo2-ExtraBold.ttf
          weight: 800
